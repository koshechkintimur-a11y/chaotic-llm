<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChaoticLLM — интерактивная карта проекта</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --partial:#d29922; --fail:#f85149; --frontier:#58a6ff; --skip:#8b949e; --accent:#bc8cff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font:13px/1.45 "Segoe UI", system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{border-bottom:1px solid var(--border); padding:10px 14px 8px; background:var(--panel); flex:0 0 auto;}
  h1{font-size:16px; font-weight:600; letter-spacing:.2px;}
  h1 span{color:var(--dim); font-weight:400; font-size:12px;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .tabs{display:flex; gap:4px;}
  .tab{padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--dim); cursor:pointer; font-size:12.5px;}
  .tab.active{background:#1f6feb33; border-color:#1f6feb; color:var(--text);}
  #search{background:#0d1117; border:1px solid var(--border); border-radius:6px; color:var(--text); padding:5px 10px; width:230px; font-size:12.5px;}
  .chip{padding:3px 10px; border-radius:20px; border:1px solid var(--border); cursor:pointer; font-size:11.5px; user-select:none; background:transparent;}
  .chip.off{opacity:.3;}
  .chip b{font-weight:600;}
  #resetView{padding:5px 12px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--dim); cursor:pointer; font-size:12px;}
  #resetView:hover{color:var(--text);}
  .legend{display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--dim); flex-wrap:wrap;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px;}
  main{flex:1; display:flex; min-height:0;}
  #stage{flex:1; position:relative; overflow:hidden; cursor:grab;}
  #stage.drag{cursor:grabbing;}
  svg{width:100%; height:100%; display:block;}
  aside{width:360px; flex:0 0 360px; border-left:1px solid var(--border); background:var(--panel); overflow-y:auto; padding:14px;}
  aside h2{font-size:14.5px; margin-bottom:2px;}
  aside .sub{color:var(--dim); font-size:11px; margin-bottom:8px;}
  .badge{display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; color:#0d1117; font-weight:600; margin-bottom:8px;}
  aside h3{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin:12px 0 4px;}
  aside p, aside li{font-size:12.5px; color:#c9d1d9;}
  aside ul{padding-left:16px;}
  aside li{margin:2px 0;}
  table{width:100%; border-collapse:collapse; margin:4px 0;}
  td{border:1px solid var(--border); padding:3px 7px; font-size:12px;}
  td:first-child{color:var(--dim); width:45%;}
  .filelink{font-family:Consolas, monospace; font-size:11.5px; color:var(--accent); word-break:break-all;}
  .placeholder{color:var(--dim); font-size:12.5px; margin-top:20px; text-align:center;}
  svg text{font-family:"Segoe UI", system-ui, sans-serif;}
  .node{cursor:pointer;}
  .node:hover rect.body{stroke-width:2.5;}
  .dimmed{opacity:.07; pointer-events:none;}
  .hiddenBySearch{opacity:.1;}
  .matchHL rect.body{stroke:#fff; stroke-width:2.5;}
  .edgeLbl{fill:var(--dim); font-size:10.5px;}
  #hint{position:absolute; bottom:8px; left:12px; color:var(--dim); font-size:11px; pointer-events:none;}
</style>
</head>
<body>
<header>
  <h1>ChaoticLLM — интерактивная карта проекта <span>· chaotic-llm · все фазы, 70+ линий экспериментов, PC-фронтир</span></h1>
  <div class="row">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="phases">Карта фаз</button>
      <button class="tab" data-tab="exps">Линии экспериментов</button>
      <button class="tab" data-tab="mech">Механизм</button>
    </div>
    <input id="search" placeholder="Поиск: exp52, PC, retrieval, morin...">
    <div class="chips row" id="filters" style="gap:6px;"></div>
    <button id="resetView">Сброс вида</button>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="stage">
    <svg id="svg"></svg>
    <div id="hint">колесо — зум · перетаскивание — панорама · клик по узлу — детали</div>
  </div>
  <aside id="panel"><div class="placeholder">Кликните узел, чтобы увидеть гипотезу, метрики, вердикт и проблемы.</div></aside>
</main>

<script>
"use strict";
/* ============================== ДАННЫЕ ============================== */
const STATUS = {
  ok:      {label:"подтверждено", short:"OK",  color:"#3fb950", icon:"✅"},
  partial: {label:"частично",     short:"ЧАСТ",color:"#d29922", icon:"⚠️"},
  fail:    {label:"провал",       short:"ПРОВ",color:"#f85149", icon:"❌"},
  frontier:{label:"фронтир",      short:"ФРОН",color:"#58a6ff", icon:"🔄"},
  skip:    {label:"пропущен",     short:"SKIP",color:"#8b949e", icon:"⏭️"},
  info:    {label:"контроль/факт",short:"ФАКТ",color:"#bc8cff", icon:"ℹ️"}
};

const PHASES = [
 {id:"p03", title:"Phase 0–3", sub:"toy-задачи, математика карты",
  desc:"Математика карты Арнольда: обратимость, периоды, перемешивание, spread, toy-модели (GSF, adaptive depth, error controller), сравнение с attention, ablation. Вердикт фазы: хаос = обратимая перестановка, не лучше random; селективность даёт только контентный readout (0.92 при 9.3× дешевле).",
  verdict:"Хаос не «вычисляет»; единственный живой компонент — перемешивание + readout."},
 {id:"p01", title:"Phase 0.1", sub:"контраргументы + синтез v0.2",
  desc:"Контраргументная фаза: адресуемость, маршрутизация, вычислимость, локальность ошибок, Пуанкаре. Плюс β-приор (morin-filter) как недостающий параметр. Итог: «хаос = дешёвый пропозер, селектор делает выбор». Иерархия окон закрывает long-range. v0.3 — полностью attention-free.",
  verdict:"Архитектура v0.2/v0.3: Mixer + readout + β-приор ≈ attention в пределах 14% PPL."},
 {id:"p4", title:"Phase 4", sub:"хаос как routing для sparse attention",
  desc:"Гипотеза: хаотический микшер дёшево предсказывает малое множество семантически значимых связей для sparse attention. Гейт recall@16 ≥ 50% провален: 11.8%, корреляция с attention ≈ 0 (Spearman 0.044). Контент-независимая динамика не может предсказывать контент-зависимые веса.",
  verdict:"Sparse routing через хаос закрыт. Микшер остаётся broadcast-пропозером."},
 {id:"p5", title:"Phase 5", sub:"β-Architecture: compute-memory split",
  desc:"Инверсия предположения трансформера: память живёт в таблице (масштабируется с КОРПУСОМ), compute — дешёвый и почти без параметров. exp22: memory-scaling подтверждён (PPL 28.3→10.35 при фиксированном микшере). β-law: оптимальный β зависит от домена и качества памяти (0.972 код / 0.5 NL / 0.9 NL+KN).",
  verdict:"Новая ось масштабирования (таблица) подтверждена; каналы комплементарны."},
 {id:"it", title:"Iteration", sub:"exp25–36: wall-clock, дешёвая память, β(c_h)",
  desc:"Векторизованный микшер закрывает wall-clock (2.9× быстрее attention при W=4096). Утилити-гейты и learned β-контроллер блокированы (память слишком дорога для гейта). Пивот exp31: sparse MLE-память — 93% качества KN при 17× меньшей стоимости. exp35/36: confidence-gate β(c_h)=c_h/(c_h+k), один бесплатный параметр, бьёт полный Kneser–Ney на обоих доменах.",
  verdict:"Architecture v0.7: Mixer + sparse MLE + β(c_h). Сильнейший результат проекта."},
 {id:"sc", title:"Селекция и масштаб", sub:"exp37–56: генерация, d-скейлинг, Око, память",
  desc:"Генерация работает end-to-end. Микшер масштабируется 90K→460K (32.8→16.7), на d=512 плато: exp41/41b/42 (оптимизатор, гейты) не помогают; exp45 — контрольный трансформер 8.65 PPL подтверждает архитектурный потолок ~460K. exp52: bidirectional + обучаемая проекция — прорыв (mixer-only 13.04, fused 8.475 — рекорд). Линии «Око» и higher-order памяти закрыты.",
  verdict:"Память архитектурно-агностична (улучшает и трансформер); compute-канал упирается в потолок без обучаемой комбинации."},
 {id:"id", title:"Идентичность через хаос", sub:"prior-prop, BLACK-HOLE H1–H3, VQ, night-CRT",
  desc:"Можно ли пронести точную идентичность токена через хаотический микшер? Протестировано ~10 способов: распространение prior (DP), чистая перестановка (DP-fix), проекторы и наблюдатели горизонта (H1/H2), CRT-наблюдатель (H3 — probe даёт 100% декодирование позиции, но в полной модели путь забивается шумом PPL), VQ-квантование. Все: retrieval = 0. Единственное, что сохраняет точность — внешняя таблица без сжатия в вектор (morin order-3, 10.46).",
  verdict:"Направление закрыто навсегда: идентичность не пересекает хаос. Транспорт нужен другой."},
 {id:"pc", title:"Pecora–Carroll", sub:"фронтир: диссипативная синхронизация",
  desc:"Математическое обоснование: у Арнольда det=1, интервалы сходимости PC по растягивающему (k∈(−0.62,1.38)) и сжимающему (k∈(1.62,3.62)) направлениям НЕ пересекаются — синхронизация невозможна в принципе. Диссипативная карта на торе (k=1.2): sync_err=0.0000, декодирование L=64 — 100%. Первый работающий транспорт идентичности за 7 фаз. Цена: отказ от точной обратимости.",
  verdict:"PC-микшер: retrieval 0.32–0.40 на всех дистанциях (sts_prog). Узкое место сместилось в ЧТЕНИЕ драйвера (oracle-потолок 23–40%)."}
];

/* experiments: phase, id, name, status, metric (короткая), hyp, results[[k,v]], verdict, problems[], files[] */
const EXPERIMENTS = [
 /* ---- Phase 0–3 ---- */
 {ph:"p03", id:"exp_00", name:"Reversibility", st:"ok", metric:"err = 0 (N=8..1024)",
  hyp:"F⁻¹(F(X))=X для карты Арнольда на Z²_N.",
  results:[["Ошибка обращения","0"],["N","8..1024"]],
  verdict:"Карта — точная обратимая перестановка.", problems:[], files:["experiments/exp_00_reversibility/"]},
 {ph:"p03", id:"exp_01", name:"Период T(N)", st:"ok", metric:"T(2^k)=3·2^(k−2), max 3N",
  hyp:"Каков период орбиты карты на конечном пространстве.",
  results:[["Средний период","~0.51N"],["Максимум","3N"]],
  verdict:"Дикая немонотонность; для степеней двойки — замкнутая форма.", problems:[], files:["experiments/exp_01_period/"]},
 {ph:"p03", id:"exp_02", name:"Mixing: хаос vs перестановки", st:"partial", metric:"перестановка = изометрия",
  hyp:"Хаос перемешивает лучше случайной/фиксированной перестановки?",
  results:[["Перестановки","изометрии: L2/Hamming сохраняются"],["Coupling","нестабилен (1.5^t)"]],
  verdict:"Перестановка НЕ перемешивает значения — обязателен coupling.", problems:["Наивное аддитивное сцепление взрывается"], files:["experiments/exp_02_mixing/"]},
 {ph:"p03", id:"exp_03", name:"Information spread", st:"partial", metric:"O(log N) при sym-coupling",
  hyp:"Сколько токенов затрагивает один сигнал.",
  results:[["Симметричный coupling","O(log N) шагов"],["Arnold vs random/fixed","без разницы"]],
  verdict:"Распространение = свойство expander-графов, не хаоса.", problems:[], files:["experiments/exp_03_information_spread/"]},
 {ph:"p03", id:"exp_04", name:"Token communication", st:"partial", metric:"нужен combine",
  hyp:"Retrieval через хаос.",
  results:[["Распространение","есть"],["Выбор","нет"]],
  verdict:"Коммуникация требует combine-операции.", problems:[], files:["experiments/exp_04_token_communication/"]},
 {ph:"p03", id:"exp_05", name:"Long-range", st:"fail", metric:"acc 0.06–0.5, нестабильно",
  hyp:"Accuracy(L) для L=2..512.",
  results:[["FullAttn","1.0 на всех L"],["Хаос","0.06–0.5, разброс между пробами"]],
  verdict:"Хаос без иерархии не тянет long-range.", problems:["Нестабильность между пробами"], files:["experiments/exp_05_long_range/"]},
 {ph:"p03", id:"exp_06", name:"GSF-гейты", st:"fail", metric:"0.189 vs 0.190",
  hyp:"Может ли контроллер направить хаос селективно.",
  results:[["Ablation −GSF","0.190 ≈ 0.189"]],
  verdict:"GSF учится как «громкость», не как маршрутизация.", problems:["Не селективен"], files:["experiments/exp_06_gsf/"]},
 {ph:"p03", id:"exp_07", name:"Adaptive depth", st:"partial", metric:"насыщение есть, критерия нет",
  hyp:"Остановка по качеству снижает compute.",
  results:[["Экономия","нет надёжного критерия остановки"]],
  verdict:"Deep supervision: предсказания не стабилизируются.", problems:["Критерий остановки не найден"], files:["experiments/exp_07_adaptive_depth/"]},
 {ph:"p03", id:"exp_08", name:"Error controller", st:"fail", metric:"0% экономии",
  hyp:"Коррекция траектории с ранним выходом.",
  results:[["Экономия","0%"]],
  verdict:"Ранний выход не сработал.", problems:[], files:["experiments/exp_08_error_controller/"]},
 {ph:"p03", id:"exp_09", name:"Обратимость под управлением", st:"fail", metric:"0.36 vs 1e-6",
  hyp:"Сохраняется ли обратимость при GSF-управлении.",
  results:[["Без управления","err 1e-6"],["С управлением","err 0.36"]],
  verdict:"Управление ломает обратимость (нужен кэш гейтов).", problems:[], files:["experiments/exp_09_reversibility_control/"]},
 {ph:"p03", id:"exp_10", name:"Toy transformer", st:"partial", metric:"Chaotic+AttnRead 0.92 (A)",
  hyp:"Обучение моделей на задачах A–D.",
  results:[["Задача A","0.92"],["Задача D +GSF","1.0"]],
  verdict:"Без селектора — шанс.", problems:[], files:["experiments/exp_10_toy_transformer/"]},
 {ph:"p03", id:"exp_11", name:"Scaling (toy)", st:"partial", metric:"FLOPs O(N log N) ✓; acc при N>16 — шанс",
  hyp:"compute(N) и accuracy(N).",
  results:[["FLOPs","разрыв 90×→212× в пользу хаоса"],["Accuracy","при N≥25 все падают к шансу (фикс. бюджет)"]],
  verdict:"Уровень 7 (scaling) не достигнут на toy.", problems:["Кривую «качество vs compute» построить не удалось"], files:["experiments/exp_11_scaling/"]},
 {ph:"p03", id:"exp_12", name:"Attention comparison", st:"ok", metric:"0.92 @ 9.3× дешевле",
  hyp:"Хаос+readout vs full attention на retrieval.",
  results:[["ChaoticAttnReadout","0.92 @ 3.66e4 FLOPs"],["FullAttn","1.0 @ 3.40e5 FLOPs"]],
  verdict:"Единственная победа Phase 0–3: дешёвый селективный readout.", problems:[], files:["experiments/exp_12_attention_comparison/"]},
 {ph:"p03", id:"exp_13", name:"Ablation", st:"ok", metric:"−coupling: 0.068 = шанс",
  hyp:"Что реально нужно: перестановка, coupling, GSF, глубина.",
  results:[["Без coupling","0.068 (шанс)"],["Без перестановки","0.180"],["GSF","0 эффект"],["Глубина 3/6/10","слабо влияет"]],
  verdict:"Решающие компоненты: coupling + селектор.", problems:[], files:["experiments/exp_13_ablation/"]},
 /* ---- Phase 0.1 ---- */
 {ph:"p01", id:"exp01", name:"Addressable iteration", st:"ok", metric:"адресация O(log t)",
  hyp:"Замкнутая форма A^t через числа Фибоначчи.",
  results:[["Адресация","O(log t)"],["Выразимость AND","нет (линейность)"]],
  verdict:"Адресовать можно, вычислять — нет.", problems:["AND не выразим"], files:["phase01/exp01_addressable_iteration.py"]},
 {ph:"p01", id:"exp02", name:"Chaotic router", st:"fail", metric:"орбита = 0.75/N",
  hyp:"Может ли хаос маршрутизировать.",
  results:[["Покрытие пространства","0.75/N"]],
  verdict:"Маршрутизация из динамики невозможна.", problems:[], files:["phase01/exp02_chaotic_router.py"]},
 {ph:"p01", id:"exp03", name:"Computation", st:"fail", metric:"readout(A^t x)=readout(x)",
  hyp:"Вычисляет ли хаос.",
  results:[["Readout по орбите","инвариантен"]],
  verdict:"Хаос не вычисляет.", problems:[], files:["phase01/exp03_computation.py"]},
 {ph:"p01", id:"exp04_05", name:"Error locality", st:"fail", metric:"семантической локальности нет",
  hyp:"Локальны ли ошибки хаоса семантически.",
  results:[["Локальность","отсутствует"]],
  verdict:"Ошибка разрушает несвязанные токены.", problems:[], files:["phase01/exp04_05_error_locality.py"]},
 {ph:"p01", id:"exp06", name:"Recurrence equivalence", st:"partial", metric:"одна карта = O(N) орбит",
  hyp:"Хаос = RNN/hash?",
  results:[["Эквивалентность","частичная"]],
  verdict:"Одна карта — ограниченный класс перестановок.", problems:[], files:["phase01/exp06_recurrence_equivalence.py"]},
 {ph:"p01", id:"exp07", name:"Poincare recurrence", st:"ok", metric:"точный возврат через T(N)",
  hyp:"Возвращение Пуанкаре на конечном пространстве.",
  results:[["Возврат","точный, за T(N)"]],
  verdict:"Фантомы Пуанкаре объясняют шансовую точность чистого хаоса.", problems:[], files:["phase01/exp07_poincare_recurrence.py"]},
 {ph:"p01", id:"exp08", name:"Phantom filter (β-приор)", st:"ok", metric:"β — недостающий параметр",
  hyp:"Корпусная статистика отсеивает «фантомные» переходы (идея morin-filter).",
  results:[["Эффект","+58% на реальных данных"]],
  verdict:"β-приор — недостающий селектор.", problems:[], files:["phase01/exp08_phantom_filter.py"]},
 {ph:"p01", id:"exp09", name:"Chaotic LM (char)", st:"ok", metric:"PPL 4.94 / 60.3%",
  hyp:"Char-LM на реальном коде с β-приором.",
  results:[["PPL","4.94"],["top-1","60.3% (2.3 п.п. от attention)"]],
  verdict:"Хаос+β почти догоняет attention.", problems:[], files:["phase01/exp09_chaotic_lm.py"]},
 {ph:"p01", id:"exp10", name:"Hierarchical LM", st:"ok", metric:"PPL 42.9 → 8.96 (4.79×)",
  hyp:"Иерархия окон (8×64 + реле) для long-range.",
  results:[["Контекст 64→256","4.79×"],["top-1","+15.6 п.п."]],
  verdict:"Иерархия закрывает long-range за O(W log W).", problems:[], files:["phase01/exp10_hierarchical_lm.py"]},
 {ph:"p01", id:"exp11", name:"BPE scaling", st:"ok", metric:"паритет 15% PPL держится",
  hyp:"Паритет хаос/attention на BPE-512 при равном бюджете.",
  results:[["PPL","25.5 vs 22.2 (15%)"]],
  verdict:"Разрыв стабилен при масштабировании словаря.", problems:[], files:["phase01/exp11_bpe_scaling.py"]},
 {ph:"p01", id:"exp12", name:"Full architecture", st:"ok", metric:"13.5 PPL / 41.4%",
  hyp:"Хаос + β-приор (β=0.3).",
  results:[["PPL","13.5 (attention: 11.9)"],["top-1","41.4%"]],
  verdict:"Разрыв с attention закрыт до 14% PPL / 1.0 п.п.", problems:[], files:["phase01/exp12_full_architecture.py"]},
 {ph:"p01", id:"exp13", name:"Two selectors", st:"ok", metric:"23.7 vs 25.7 у трансформера",
  hyp:"+ attention-readout поверх микшера и β.",
  results:[["PPL @12K шагов","23.7 (AttnLM: 25.7)"],["top-1+β","41.4%"]],
  verdict:"Лучший результат сравнения на равном бюджете.", problems:[], files:["phase01/exp13_two_selectors.py"]},
 {ph:"p01", id:"exp14", name:"Multilayer", st:"fail", metric:"L2≈L1, L4 хуже",

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function txt(x, y, s, attrs, parent){
  const t = el("text", Object.assign({x:x, y:y}, attrs||{}), parent);
  t.textContent = s;
  return t;
}
function applyView(){ svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+view.h); }

function roundedRect(g, x, y, w, h, r, fill, stroke){
  return el("rect", {class:"body", x:x, y:y, width:w, height:h, rx:r, ry:r, fill:fill, stroke:stroke, "stroke-width":1.4}, g);
}

/* ---- построение узла эксперимента/фазы ---- */
function makeNode(g, x, y, w, h, data, kind){
  const st = STATUS[data.st] || STATUS.info;
  const grp = el("g", {class:"node"}, g);
  roundedRect(grp, x, y, w, h, 9, "#161b22", st.color);
  el("rect", {x:x, y:y, width:5, height:h, rx:2.5, fill:st.color}, grp);
  const fs = kind==="phase" ? 15 : 12.5;
  const title = txt(x+13, y+ (kind==="phase"?30:26), data.title !== undefined ? data.title : data.name, {fill:"#e6edf3","font-size":fs,"font-weight":"600"}, grp);
  // обрезка длинных заголовков
  if(title.getComputedTextLength && title.getComputedTextLength() > w-22){
    let s = title.textContent;
    while(s.length > 4 && title.getComputedTextLength() > w-22){ s = s.slice(0,-2); title.textContent = s+"…"; }
  }
  if(kind==="phase"){
    txt(x+13, y+50, data.sub, {fill:"#8b949e","font-size":11.5}, grp);
    const counts = countStatuses(data.id);
    txt(x+13, y+74, counts, {fill:st.color,"font-size":11.5,"font-weight":"600"}, grp);
    txt(x+13, y+92, "клик — сводка фазы", {fill:"#8b949e","font-size":10}, grp);
  } else {
    // metric — переносы до 2 строк
    const m = data.metric || "";
    const lines = wrapText(m, w-24, 11);
    lines.slice(0,2).forEach((ln,i)=> txt(x+13, y+45+i*15, ln, {fill:st.color,"font-size":11,"font-weight":"500"}, grp));
    txt(x+13, y+h-12, st.icon+" "+st.label, {fill:"#8b949e","font-size":10.5}, grp);
  }
  grp.addEventListener("click", (ev)=>{ ev.stopPropagation(); showPanel(data, kind); });
  return grp;
}
function wrapText(s, maxPx, fontPx){
  const c = document.createElement("canvas").getContext("2d");
  c.font = "500 "+fontPx+"px 'Segoe UI', sans-serif";
  const words = s.split(" ");
  const lines = []; let line = "";
  for(const wd of words){
    const test = line ? line+" "+wd : wd;
    if(c.measureText(test).width > maxPx && line){ lines.push(line); line = wd; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines;
}
function countStatuses(ph){
  const es = EXPERIMENTS.filter(e=>e.ph===ph);
  const c = {ok:0, partial:0, fail:0, frontier:0, skip:0, info:0};
  es.forEach(e=>{ c[e.st] = (c[e.st]||0)+1; });
  return "✅"+c.ok+"  ⚠️"+c.partial+"  ❌"+c.fail+(c.frontier?"  🔄"+c.frontier:"");
}

function phaseStatus(ph){

  if(kind==="phase"){
    const es = EXPERIMENTS.filter(e=>e.ph===data.id);
    let html = "<h2>"+esc(data.title)+"</h2><div class='sub'>"+esc(data.sub)+"</div>";
    html += "<span class='badge' style='background:"+(STATUS[phaseStatus(data.id)].color)+"'>"+STATUS[phaseStatus(data.id)].icon+" фаза: "+STATUS[phaseStatus(data.id)].label+"</span>";
    html += "<p>"+esc(data.desc)+"</p><h3>Вердикт</h3><p>"+esc(data.verdict)+"</p>";
    html += "<h3>Эксперименты ("+es.length+")</h3><ul>";
    es.forEach(e=>{ html += "<li><b>"+esc(e.id)+"</b> "+esc(e.name)+" — "+STATUS[e.st].icon+" "+esc(e.metric)+"</li>"; });
    html += "</ul>";
    p.innerHTML = html; return;
  }
  const st = STATUS[data.st];
  let html = "<h2>"+esc(data.id)+" · "+esc(data.name)+"</h2>";
  html += "<span class='badge' style='background:"+st.color+"'>"+st.icon+" "+st.label+"</span>";
  html += "<h3>Гипотеза</h3><p>"+esc(data.hyp)+"</p>";
  if(data.results && data.results.length){
    html += "<h3>Результаты</h3><table>";
    data.results.forEach(r=>{ html += "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>"; });
    html += "</table>";
  }
  html += "<h3>Вердикт</h3><p>"+esc(data.verdict)+"</p>";
  if(data.problems && data.problems.length){
    html += "<h3>Проблемы / failure modes</h3><ul>";
    data.problems.forEach(pr=>{ html += "<li>"+esc(pr)+"</li>"; });
    html += "</ul>";
  }
  if(data.files && data.files.length){
    html += "<h3>Файлы</h3>";
    data.files.forEach(f=>{ html += "<div class='filelink'>chaotic-llm/"+esc(f)+"</div>"; });
  }
  p.innerHTML = html;
}
function showMechPanel(n){
  const st = STATUS[n.st];
  let html = "<h2>"+esc(n.title)+"</h2><div class='sub'>узел механизма</div>";
  html += "<span class='badge' style='background:"+st.color+"'>"+st.icon+" "+st.label+"</span>";
  html += "<p>"+esc(n.desc)+"</p>";
  if(n.warn){ html += "<h3>⚠ Проблема / узкое место</h3><p style='color:#f0b72f'>"+esc(n.warn)+"</p>"; }
  const panel = document.getElementById("panel"); panel.innerHTML = html;
}

/* ---- утилиты ---- */
function clearSvg(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  nodesIndex = {};
  const defs = el("defs", {}, svg);
  const mk = (id,color)=>{ const m = el("marker",{id:id,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"},defs); el("path",{d:"M0,0 L10,5 L0,10 z",fill:color},m); };
  mk("arrow","#8b949e"); mk("arrowBlue","#58a6ff"); mk("arrowRed","#f85149");
}

/* ---- пан/зум ---- */
const stage = document.getElementById("stage");
let dragging=false, dsx=0, dsy=0, dvx=0, dvy=0;
stage.addEventListener("mousedown", e=>{ dragging=true; stage.classList.add("drag"); dsx=e.clientX; dsy=e.clientY; dvx=view.x; dvy=view.y; });
window.addEventListener("mouseup", ()=>{ dragging=false; stage.classList.remove("drag"); });
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  const rect = svg.getBoundingClientRect();
  view.x = dvx - (e.clientX-dsx)*view.w/rect.width;
  view.y = dvy - (e.clientY-dsy)*view.h/rect.height;
  applyView();
});
stage.addEventListener("wheel", e=>{
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = view.x + (e.clientX-rect.left)*view.w/rect.width;
  const my = view.y + (e.clientY-rect.top)*view.h/rect.height;
  const f = e.deltaY>0 ? 1.12 : 1/1.12;
  const nw = Math.min(6000, Math.max(300, view.w*f));
  const k = nw/view.w;
  view.x = mx - (mx-view.x)*k; view.y = my - (my-view.y)*k; view.w = nw; view.h = view.h*k;
  applyView();
}, {passive:false});
document.getElementById("resetView").addEventListener("click", ()=>{
  if(curTab==="phases"){ view={x:0,y:0,w:2400,h:1350}; }
  else if(curTab==="exps"){ drawExps(); return; }
  else { view={x:0,y:60,w:1700,h:950}; }
  applyView();
});

/* ---- фильтры и поиск ---- */
function buildFilters(){
  const box = document.getElementById("filters");
  box.innerHTML = "";
  Object.entries(STATUS).forEach(([k,s])=>{
    const n = totalOf(k);
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.borderColor = s.color;
    chip.innerHTML = "<b style='color:"+s.color+"'>"+s.icon+" "+s.label+"</b> · "+n;
    if(!filters.has(k)) chip.classList.add("off");
    chip.addEventListener("click", ()=>{
      if(filters.has(k)) filters.delete(k); else filters.add(k);
      chip.classList.toggle("off");
      applyFilters();
    });
    box.appendChild(chip);
  });
}
function totalOf(k){ return EXPERIMENTS.filter(e=>e.st===k).length; }
function applyFilters(){
  for(const key in nodesIndex){
    const item = nodesIndex[key];
    const d = item.data;
    const st = (key.startsWith("phase_")) ? phaseStatus(d.id) : (d.st || "info");
    const vis = filters.has(st);
    item.el.classList.toggle("dimmed", !vis);
  }
  applySearch();
}
document.getElementById("search").addEventListener("input", e=>{
  searchText = e.target.value.trim().toLowerCase();
  applySearch();
});
function applySearch(){
  for(const key in nodesIndex){
    const item = nodesIndex[key];
    item.el.classList.remove("matchHL","hiddenBySearch");
    if(searchText.length < 2) continue;
    const d = item.data;
    const hay = (key+" "+(d.name||d.title||"")+" "+(d.metric||"")+" "+(d.hyp||"")+" "+(d.verdict||"")+" "+(d.sub||"")).toLowerCase();
    if(hay.includes(searchText)) item.el.classList.add("matchHL");
    else item.el.classList.add("hiddenBySearch");
  }
}

/* ---- табы ---- */
document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    b.classList.add("active");
    curTab = b.dataset.tab;
    searchText = ""; document.getElementById("search").value = "";
    if(curTab==="phases"){ drawPhases(); view={x:0,y:0,w:2400,h:1350}; }
    else if(curTab==="exps"){ drawExps(); }
    else { drawMech(); }
    applyFilters();
  });
});

/* ---- легенда ---- */
(function(){
  const lg = document.getElementById("legend");
  lg.innerHTML = "Статусы линий: " + Object.values(STATUS).map(s=>"<span><i style='background:"+s.color+"'></i>"+s.icon+" "+s.label+"</span>").join(" · ");
})();

/* ---- init ---- */
drawPhases();
buildFilters();
</script>
